<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel da coordenação: PS Modo Black Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E5E1; --surface:#FFFFFF; --surface-2:#F3F3F0; --ink:#1C1D1F; --muted:#56595E; --line:#CBCCC7;
  --yellow:#FFCC00; --edge:#1C1D1F; --green:#10905A; --orange:#DD7A00; --red:#C9352A; --blue:#2856CC;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#131518; --surface:#1E2125; --surface-2:#272B30; --ink:#F1F1EC; --muted:#A7ABB1; --line:#383D44; --green:#26B672; --orange:#FF9B22; --red:#F0564A; --blue:#6690F2; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#131518; --surface:#1E2125; --surface-2:#272B30; --ink:#F1F1EC; --muted:#A7ABB1; --line:#383D44; --green:#26B672; --orange:#FF9B22; --red:#F0564A; --blue:#6690F2; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.hazard{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--edge) 14px 28px)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
h1,h2{font-family:var(--display);margin:0;line-height:1.05}
h1{font-size:clamp(28px,5vw,40px);font-weight:900;font-stretch:80%}
h2{font-size:22px;font-weight:850;font-stretch:85%}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:2px solid var(--edge);background:var(--yellow);color:var(--edge);font-family:var(--display);font-weight:850;font-size:16px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.login{max-width:420px;margin:40px auto}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:700;margin-bottom:5px}
.field input,.field select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.err{color:var(--red);font-weight:700;min-height:22px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-weight:900;font-stretch:78%;font-size:38px;line-height:1}
.kpi span{color:var(--muted);font-size:14px}
.kpi.hl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hl span{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}
.filters input,.filters select{min-height:44px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);width:100%}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:900px}
th{text-align:left;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.2px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--green) 18%,var(--surface));color:var(--green)}
.tag.run{background:color-mix(in srgb,var(--orange) 18%,var(--surface));color:var(--orange)}
.tag.no{background:color-mix(in srgb,var(--red) 15%,var(--surface));color:var(--red)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;width:90px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}
details{margin-top:16px}
summary{cursor:pointer;font-family:var(--display);font-weight:800;font-size:17px}
.note{font-size:14px;margin-top:10px}
@media (max-width:700px){ .filters{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="hazard"></div>
<main class="wrap" id="app"></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
const CFG = window.PS_CONFIG || {};
const app = document.getElementById("app");
const TOTAL_MISSOES = 8;
let sb = null, linhas = [];

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function dt(iso){ if(!iso) return "–"; const d=new Date(iso); return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function dur(a,b){
  if(!a||!b) return "–";
  let m = Math.max(0, Math.round((new Date(b)-new Date(a))/60000));
  const d=Math.floor(m/1440); m-=d*1440; const h=Math.floor(m/60); m-=h*60;
  return (d?d+"d ":"")+(h?h+"h ":"")+m+"min";
}

if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase){
  app.innerHTML = `<div class="card login"><h1>Painel da coordenação</h1><p class="muted" style="margin-top:10px">Falta configurar o Supabase no arquivo <b>config.js</b> (SUPABASE_URL e SUPABASE_ANON_KEY). Veja o passo a passo no LEIA-ME.</p></div>`;
} else {
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.getSession().then(({data})=> data.session ? painel() : login());
}

function login(msg){
  app.innerHTML = `<div class="card login">
    <h1>Painel da coordenação</h1>
    <p class="muted" style="margin:8px 0 16px">Treinamento PS Modo Black Friday</p>
    <form id="f">
      <label class="field"><span>E-mail</span><input id="em" type="email" autocomplete="username" required></label>
      <label class="field"><span>Senha</span><input id="pw" type="password" autocomplete="current-password" required></label>
      <div class="err" id="er">${esc(msg||"")}</div>
      <button class="btn" style="width:100%" type="submit">Entrar</button>
    </form></div>`;
  document.getElementById("f").onsubmit = async (ev)=>{
    ev.preventDefault();
    const er=document.getElementById("er"); er.textContent="Entrando…";
    const {error} = await sb.auth.signInWithPassword({email:document.getElementById("em").value.trim(), password:document.getElementById("pw").value});
    if(error){ er.textContent="E-mail ou senha incorretos."; return; }
    painel();
  };
}

async function carregar(){
  const todos=[]; const passo=1000;
  for(let de=0; de<50000; de+=passo){
    const {data,error} = await sb.from("ps_eventos").select("sessao_id,nome,turno,evento,detalhe,ocorrido_em").order("ocorrido_em",{ascending:true}).range(de,de+passo-1);
    if(error) throw error;
    todos.push(...data);
    if(data.length<passo) break;
  }
  const por = new Map();
  for(const e of todos){
    let p = por.get(e.sessao_id);
    if(!p){ p={sessao:e.sessao_id,nome:e.nome,turno:e.turno,inicio:null,fim:null,missoes:new Set(),chefaoMelhor:null,chefaoTent:0,brinde:"",ultima:null}; por.set(e.sessao_id,p); }
    p.nome=e.nome; p.turno=e.turno;
    p.ultima = e.ocorrido_em;
    const d = e.detalhe||{};
    if(e.evento==="inicio" && (!p.inicio || e.ocorrido_em<p.inicio)) p.inicio=e.ocorrido_em;
    if(e.evento==="fim" && (!p.fim || e.ocorrido_em<p.fim)) p.fim=e.ocorrido_em;
    if(e.evento==="missao" && d.missao) p.missoes.add(d.missao);
    if(e.evento==="chefao"){ p.chefaoTent++; p.chefaoMelhor=Math.max(p.chefaoMelhor||0, d.nota||0); }
    if(e.evento==="brinde") p.brinde=d.brinde||"";
  }
  linhas = [...por.values()].map(p=>({...p, nMissoes: p.fim ? TOTAL_MISSOES : p.missoes.size, status: p.fim ? "Concluiu" : "Em andamento"}))
    .sort((a,b)=> String(b.inicio||"").localeCompare(String(a.inicio||"")));
}

function painel(){
  app.innerHTML = `
  <div class="top">
    <div><h1>Painel da coordenação</h1><p class="muted" style="margin:6px 0 0">Treinamento PS Modo Black Friday: quem iniciou, quem concluiu e quando.</p></div>
    <div class="actions">
      <button class="btn ghost" id="rf">↻ Atualizar</button>
      <button class="btn" id="csv">⬇ Exportar CSV</button>
      <button class="btn ghost" id="out">Sair</button>
    </div>
  </div>
  <div id="body"><p class="muted">Carregando…</p></div>`;
  document.getElementById("rf").onclick = painel;
  document.getElementById("out").onclick = async ()=>{ await sb.auth.signOut(); login(); };
  document.getElementById("csv").onclick = exportar;
  carregar().then(desenhar).catch(e=>{ document.getElementById("body").innerHTML=`<p class="err">Erro ao carregar: ${esc(e.message||e)}</p>`; });
}

function equipe(){ try{ return (localStorage.getItem("ps-equipe")||""); }catch(e){ return ""; } }

function desenhar(){
  const turnos = [...new Set(linhas.map(l=>l.turno))].sort();
  const body = document.getElementById("body");
  body.innerHTML = `
  <div class="kpis" id="kp"></div>
  <div class="filters">
    <input id="q" placeholder="Buscar por nome" aria-label="Buscar por nome">
    <select id="ft" aria-label="Filtrar turno"><option value="">Todos os turnos</option>${turnos.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
    <select id="fs" aria-label="Filtrar status"><option value="">Todos os status</option><option>Concluiu</option><option>Em andamento</option><option value="Não iniciou">Não iniciou (da lista da equipe)</option></select>
  </div>
  <div class="tbl"><table>
    <thead><tr><th>Nome</th><th>Turno</th><th>Status</th><th>Iniciou em</th><th>Concluiu em</th><th>Tempo total</th><th>Missões</th><th>Chefão</th><th>Brinde escolhido</th></tr></thead>
    <tbody id="tb"></tbody></table></div>
  <details>
    <summary>Lista da equipe: ver quem ainda não iniciou</summary>
    <p class="note muted">Cole os nomes de todos os PS, um por linha. O painel compara com quem já entrou no curso (ignora acentos e maiúsculas). A lista fica salva só neste navegador.</p>
    <textarea id="eq" rows="8" placeholder="Ana Paula Souza&#10;João da Silva&#10;…"></textarea>
    <button class="btn ghost" id="sv" style="margin-top:8px">Salvar lista</button>
  </details>`;
  document.getElementById("eq").value = equipe();
  document.getElementById("sv").onclick = ()=>{ try{ localStorage.setItem("ps-equipe", document.getElementById("eq").value); }catch(e){} render(); };
  ["q","ft","fs"].forEach(id=>document.getElementById(id).oninput=render);
  render();
}

function naoIniciaram(){
  const feitos = new Set(linhas.map(l=>norm(l.nome)));
  return equipe().split(/\n/).map(s=>s.trim()).filter(Boolean).filter(n=>!feitos.has(norm(n)));
}

function filtradas(){
  const q=norm(document.getElementById("q").value), ft=document.getElementById("ft").value, fs=document.getElementById("fs").value;
  let rows = linhas.slice();
  if(fs==="Não iniciou") rows = naoIniciaram().map(n=>({nome:n,turno:"",status:"Não iniciou",nMissoes:0}));
  else if(fs) rows = rows.filter(l=>l.status===fs);
  if(ft) rows = rows.filter(l=>l.turno===ft);
  if(q) rows = rows.filter(l=>norm(l.nome).includes(q));
  return rows;
}

function render(){
  const ok = linhas.filter(l=>l.fim).length, run = linhas.length-ok, nao = naoIniciaram().length;
  document.getElementById("kp").innerHTML = `
    <div class="kpi"><b>${linhas.length}</b><span>iniciaram</span></div>
    <div class="kpi hl"><b>${ok}</b><span>concluíram</span></div>
    <div class="kpi"><b>${run}</b><span>em andamento</span></div>
    <div class="kpi"><b>${linhas.length? Math.round(ok/linhas.length*100):0}%</b><span>taxa de conclusão</span></div>
    ${equipe().trim()?`<div class="kpi"><b>${nao}</b><span>da equipe ainda não iniciaram</span></div>`:""}`;
  const rows = filtradas();
  document.getElementById("tb").innerHTML = rows.length ? rows.map(l=>{
    const tag = l.status==="Concluiu"?"ok":(l.status==="Não iniciou"?"no":"run");
    const pct = Math.round((l.nMissoes||0)/TOTAL_MISSOES*100);
    return `<tr>
      <td><b>${esc(l.nome)}</b></td><td>${esc(l.turno||"–")}</td>
      <td><span class="tag ${tag}">${esc(l.status)}</span></td>
      <td>${dt(l.inicio)}</td><td>${dt(l.fim)}</td><td>${dur(l.inicio,l.fim)}</td>
      <td>${l.status==="Não iniciou"?"–":`${l.nMissoes}/${TOTAL_MISSOES}<div class="bar"><i style="width:${pct}%"></i></div>`}</td>
      <td>${l.chefaoMelhor!=null?`${l.chefaoMelhor}/10 <span class="muted">(${l.chefaoTent}x)</span>`:"–"}</td>
      <td>${esc(l.brinde||"–")}</td></tr>`;
  }).join("") : `<tr><td colspan="9" class="muted">Nada por aqui com esse filtro.</td></tr>`;
}

function exportar(){
  const rows = linhas;
  const head = ["Nome","Turno","Status","Iniciou em","Concluiu em","Tempo total","Missões","Chefão (melhor nota)","Tentativas chefão","Brinde"];
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const out = [head.map(q).join(";")].concat(rows.map(l=>[l.nome,l.turno,l.status,dt(l.inicio),dt(l.fim),dur(l.inicio,l.fim),`${l.nMissoes}/${TOTAL_MISSOES}`,l.chefaoMelhor??"",l.chefaoTent,l.brinde].map(q).join(";")));
  naoIniciaram().forEach(n=>out.push([n,"","Não iniciou","","","","","","",""].map(q).join(";")));
  const blob = new Blob(["\ufeff"+out.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "treinamento-ps-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
</script>
</body>
</html>

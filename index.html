    if(n.split(" ").length<2 || n.length<5){ er.textContent="Coloca nome e sobrenome, pra aparecer certinho no certificado."; return; }
    if(!t){ er.textContent="Escolhe teu turno."; return; }
    S = fresh(); S.name=n; S.turno=t; S.started=new Date().toISOString(); S.sid=uid(); save(); track("inicio",{},S.started);
    go("map");
  };
},

map(){
  if(!S.name) return go("start");
  renderTop(true);
  const {L,nx} = level(S.xp);
  const pct = nx ? Math.min(100, Math.round((S.xp-L.xp)/(nx.xp-L.xp)*100)) : 100;
  const doneCount = MODULES.filter((m,i)=>mod(i).passed).length;
  let html = `
  <section class="player">
    <div class="hi">Nível atual de <span id="pn"></span></div>
    <div class="lvl">${L.e} ${L.n}</div>
    <div class="xpbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="xpmeta"><span>${S.xp} XP</span><span>${nx? "Faltam "+(nx.xp-S.xp)+" pra "+nx.e : "Nível máximo 👑"}</span></div>
    <div class="badges">${MODULES.map((m,i)=>`<span class="badge ${mod(i).passed?"":"off"}" title="${esc(m.badge)}">${m.emoji}</span>`).join("")}<span class="badge ${S.boss&&S.boss.passed?"":"off"}" title="Chefão derrotado">👹</span></div>
  </section>
  <h2 style="margin-bottom:6px">Tua trilha</h2>
  <p class="muted small" style="margin-bottom:16px">${doneCount} de ${MODULES.length} missões concluídas${doneCount===MODULES.length?" 🎉":""}</p>
  <ol class="trail">`;
  MODULES.forEach((m,i)=>{
    const st = mod(i), op = unlocked(i);
    const cls = st.passed ? "done" : (op ? "open" : "locked");
    const status = st.passed ? `✔ Concluída: melhor nota ${st.best}/5${st.perfect?" ⭐":""}` : (op ? (st.attempts? `Tentativas: ${st.attempts}. Precisa de 4/5` : "Liberada: bora!") : "🔒 Conclui a anterior pra liberar");
    html += `<li class="stop ${cls}">
      <div class="node" aria-hidden="true">${st.passed?"✔":(op?m.emoji:"🔒")}</div>
      <button class="label" data-i="${i}" ${op?"":"disabled"} aria-label="Missão ${i+1}: ${esc(m.title)}. ${esc(status)}">
        <span class="code"><span class="barcode"></span>MISSÃO ${i+1}</span>
        <span class="t" style="display:block">${esc(m.title)}</span>
        <span class="s" style="display:block">${esc(status)}</span>
      </button></li>`;
  });
  const bossOpen = allPassed();
  const bs = S.boss;
  html += `<li class="stop boss ${bs&&bs.passed?"done":(bossOpen?"open":"locked")}">
    <div class="node" aria-hidden="true">${bs&&bs.passed?"✔":(bossOpen?"👹":"🔒")}</div>
    <button class="label" id="boss" ${bossOpen?"":"disabled"}>
      <span class="code"><span class="barcode"></span>FINAL</span>
      <span class="t" style="display:block">Chefão da Black Friday</span>
      <span class="s" style="display:block">${bs&&bs.passed?`✔ Derrotado: ${bs.best}/${BOSS_N}`:(bossOpen?`${BOSS_N} perguntas sorteadas, ${BOSS_SEC}s cada. Precisa de ${BOSS_MIN}.`:"🔒 Conclui as "+MODULES.length+" missões")}</span>
    </button></li></ol>`;
  if(S.cert){ html += `<button class="btn dark" id="cert" style="margin-top:8px">🏅 Meu certificado SUPER PS</button>`; }
  if(S.admin){ html += `<section class="admbox">
    <b>🛠️ Modo administrador</b>
    <p class="small muted" style="margin:4px 0 12px">Todas as missões e o chefão estão liberados, sem tempo de leitura. Nada do que tu faz aqui vai pra planilha.</p>
    <div class="stack">
      <button class="btn ghost" id="adm-fim">🎉 Ver tela de conclusão e certificado</button>
      <button class="btn ghost" id="adm-brinde">🎁 Liberar a escolha do brinde de novo</button>
      <button class="btn ghost" id="adm-sair">Sair do modo administrador</button>
    </div></section>`; }
  html += `<div class="foot stack">
    <button class="linkish" id="swap">Não é <span id="fn2"></span>? Trocar de pessoa</button>
  </div>`;
  app.innerHTML = html;
  document.getElementById("pn").textContent = firstName();
  document.getElementById("fn2").textContent = firstName();
  app.querySelectorAll(".label[data-i]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(unlocked(i)) go("intro",i); });
  const bb = document.getElementById("boss"); if(bb) bb.onclick = ()=>{ if(allPassed()) go("bossIntro"); };
  const cb = document.getElementById("cert"); if(cb) cb.onclick = ()=>go("cert");
  if(S.admin){
    document.getElementById("adm-fim").onclick = ()=>{ if(!S.cert) S.cert={xp:S.xp, date:new Date().toISOString(), boss:BOSS_N}; save(); go("celebrate"); };
    document.getElementById("adm-brinde").onclick = ()=>{ S.brinde=null; save(); toast("🎁 Escolha do brinde liberada"); };
    document.getElementById("adm-sair").onclick = ()=>{ try{ localStorage.removeItem(KEY); }catch(e){} S=fresh(); go("start"); };
  }
  let armed=false;
  document.getElementById("swap").onclick = (ev)=>{
    if(!armed){ armed=true; ev.currentTarget.textContent="Toca de novo pra apagar o progresso deste celular"; return; }
    try{ localStorage.removeItem(KEY); }catch(e){} S=fresh(); go("start");
  };
},

intro(i){
  const m = MODULES[i], st = mod(i);
  renderTop(true);
  app.innerHTML = `
  <div class="modhead">
    <div class="code"><span class="barcode"></span>MISSÃO ${i+1} DE ${MODULES.length}</div>
    <div style="font-size:54px;line-height:1;margin:8px 0">${m.emoji}</div>
    <h2>${esc(m.title)}</h2>
    <p class="muted" style="margin-top:8px">${esc(m.sub)}</p>
  </div>
  <div class="rules"><ul style="margin:0">
    <li>📖 ${m.cards.length} cards pra ler</li>
    <li>❓ 5 perguntas no final (precisa de 4)</li>
    <li>🏅 Insígnia: <b>${esc(m.badge)}</b></li>
  </ul></div>
  <div class="stack">
    <button class="btn" id="rd">${st.read?"Reler o conteúdo 📖":"Começar a leitura 📖"}</button>
    ${(st.read||S.admin)?`<button class="btn ghost" id="qz">Ir direto pras perguntas</button>`:""}
    <button class="btn ghost" id="bk">Voltar pra trilha</button>
  </div>`;
  document.getElementById("rd").onclick = ()=>go("read",{i,c:0});
  const q=document.getElementById("qz"); if(q) q.onclick=()=>go("quiz",{i});
  document.getElementById("bk").onclick = ()=>go("map");
},

read({i,c}){
  const m = MODULES[i], st = mod(i), card = m.cards[c];
  const last = c===m.cards.length-1;
  renderTop(true);
  app.innerHTML = `
  <div class="modhead" style="padding-bottom:0">
    <div class="code"><span class="barcode"></span>MISSÃO ${i+1}: CARD ${c+1} DE ${m.cards.length}</div>
  </div>
  <div class="segs" aria-hidden="true">${m.cards.map((_,k)=>`<i class="${k<=c?"on":""}"></i>`).join("")}</div>
  <article class="card">
    <div class="emoji" aria-hidden="true">${card.e}</div>
    <h3>${esc(card.t)}</h3>
    <div>${card.b}</div>
    ${card.tip?`<div class="tip"><strong>💡 Dica de ouro</strong>${esc(card.tip)}</div>`:""}
    ${card.trap?`<div class="trap"><strong>⚠️ É cilada!</strong>${esc(card.trap)}</div>`:""}
  </article>
  <div class="navrow">
    ${c>0?`<button class="btn ghost" id="pv" aria-label="Card anterior">←</button>`:""}
    <button class="btn" id="nx">${last?"Partiu perguntas 🎯":"Próximo card"}</button>
  </div>`;
  const nx = document.getElementById("nx");
  const label = nx.textContent;
  // tempo mínimo de leitura na primeira vez
  const words = (card.b+(card.tip||"")+(card.trap||"")).replace(/<[^>]+>/g," ").split(/\s+/).length;
  const wait = (st.read||S.admin) ? 0 : Math.min(9, Math.max(3, Math.round(words/22)));
  if(wait>0){
    nx.disabled = true;
    let left = wait;
    nx.innerHTML = `<span class="wait-fill" id="wf"></span><span style="position:relative">Lendo… ${left}s</span>`;
    const wf = document.getElementById("wf");
    requestAnimationFrame(()=>{ wf.style.transition=`width ${wait}s linear`; wf.style.width="100%"; });
    const t = setInterval(()=>{
      left--;
      if(left<=0){ clearInterval(t); nx.disabled=false; nx.textContent=label; }
      else nx.querySelector("span:last-child").textContent=`Lendo… ${left}s`;
    },1000);
    timers.push(t);
  }
  nx.onclick = ()=>{
    if(last){ st.read=true; save(); go("quiz",{i}); }
    else go("read",{i,c:c+1});
  };
  const pv=document.getElementById("pv"); if(pv) pv.onclick=()=>go("read",{i,c:c-1});
},

quiz({i,boss}){
  renderTop(true);
  let qs;
  if(boss){
    const pool=[]; MODULES.forEach((m,mi)=>m.quiz.forEach(q=>pool.push(Object.assign({mi},q))));
    qs = shuffle(pool).slice(0,BOSS_N);
  } else {
    qs = shuffle(MODULES[i].quiz);
  }
  const first = boss ? !(S.boss&&S.boss.passed) : mod(i).attempts===0;
  const run = {idx:0,right:0,streak:0,xp:0,combo:0};
  const total = qs.length;

  function show(){
    clearTimers();
    const q = qs[run.idx];
    const order = shuffle([0,1,2,3]);
    const letters = ["A","B","C","D"];
    app.innerHTML = `
    <div class="qtop">
      <span class="qcount">${boss?"👹 Chefão":"Missão "+(i+1)}: pergunta ${run.idx+1}/${total}</span>
      <span class="streak">${run.streak>=2?"🔥 "+run.streak+" seguidas":""}</span>
    </div>
    ${boss?`<div class="timer" aria-hidden="true"><i id="tm"></i></div>`:""}
    <article class="qcard">
      <span class="sit">${esc(q.s)}</span>
      <div class="prompt">${esc(q.q)}</div>
      <div class="opts" role="group" aria-label="Alternativas">
        ${order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${letters[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}
      </div>
    </article>
    <div id="fb"></div>`;
    const btns = [...app.querySelectorAll(".opt")];
    btns.forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
    if(boss){
      const tm=document.getElementById("tm"); const t0=Date.now();
      const t=setInterval(()=>{
        const left = BOSS_SEC - (Date.now()-t0)/1000;
        tm.style.width = Math.max(0,left/BOSS_SEC*100)+"%";
        if(left<=6) tm.classList.add("hot");
        if(left<=0){ clearInterval(t); answer(-1); }
      },100);
      timers.push(t);
      run.t0=t0;
    }
    function answer(oi){
      clearTimers();
      const ok = oi===0;
      btns.forEach(b=>{ b.disabled=true; const v=+b.dataset.oi; if(v===0) b.classList.add("right"); else if(v===oi) b.classList.add("wrong"); });
      let gain=0, extra="";
      if(ok){
        run.right++; run.streak++;
        if(boss){ const secLeft=Math.max(0,Math.round(BOSS_SEC-(Date.now()-run.t0)/1000)); gain = (first?150:60) + (first?secLeft*4:0); if(first&&secLeft) extra=` (+${secLeft*4} de rapidez)`; }
        else gain = first?100:40;
        if(run.streak>0 && run.streak%3===0){ gain+=50; run.combo++; extra+=" 🔥 COMBO!"; }
      } else run.streak=0;
      run.xp += gain;
      beep(ok);
      const fb = document.getElementById("fb");
      fb.innerHTML = `<div class="hh ${ok?"ok":"bad"}" role="status">
        <div class="hh-screen"><div class="scan"></div>
          <div class="hh-title">${ok?"TELA VERDE ✔":(oi===-1?"TEMPO ESGOTOU ⏱":"TELA LARANJA ✖")}</div>
          <div class="hh-sub">${ok?pick(RIGHT):pick(WRONG)}</div>
          <div class="hh-exp"><b>Papo reto:</b> ${esc(q.e)}</div>
          ${gain?`<span class="hh-xp">+${gain} XP${esc(extra)}</span>`:""}
        </div>
        <button class="btn" id="go">${run.idx+1<total?"Próxima pergunta":"Ver resultado"}</button>
      </div>`;
      const g=document.getElementById("go");
      g.onclick = next;
      setTimeout(()=>{ fb.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"end"}); try{g.focus({preventScroll:true})}catch(e){} },60);
    }
  }
  function next(){
    run.idx++;
    if(run.idx<total){ window.scrollTo(0,0); show(); }
    else finish();
  }
  function finish(){
    let bonus=[];
    if(boss){
      const passed = run.right>=BOSS_MIN;
      const prev = S.boss||{best:0,passed:false,attempts:0};
      if(passed && !prev.passed){ bonus.push(["Chefão derrotado",300]); }
      const b = {best:Math.max(prev.best,run.right),passed:prev.passed||passed,attempts:prev.attempts+1};
      S.boss=b;
      const add = run.xp + bonus.reduce((a,x)=>a+x[1],0);
      S.xp += add;
      let primeiraVez=false;
      if(passed && !S.cert){
        S.cert = {xp:S.xp, date:new Date().toISOString(), boss:run.right};
        primeiraVez=true;
      }
      save();
      track("chefao",{nota:run.right,passou:passed});
      if(primeiraVez){ track("fim",{xp:S.xp},S.cert.date); return go("celebrate"); }
      go("result",{boss:true,right:run.right,total,passed,xp:run.xp,bonus});
    } else {
      const st = mod(i);
      const passed = run.right>=PASS_MIN;
      if(passed && !st.passed) bonus.push(["Missão concluída",150]);
      if(run.right===total && !st.perfect){ bonus.push(["Gabaritou ⭐",100]); st.perfect=true; }
      const jaPassou = st.passed;
      st.attempts++; st.best=Math.max(st.best,run.right); st.passed = st.passed||passed;
      if(passed && !jaPassou) track("missao",{missao:i+1,nota:run.right,tentativas:st.attempts});
      S.xp += run.xp + bonus.reduce((a,x)=>a+x[1],0);
      save();
      go("result",{i,right:run.right,total,passed,xp:run.xp,bonus});
    }
  }
  show();
},

result(r){
  renderTop(true);
  const perfect = r.right===r.total;
  let big, title, msg;
  if(r.boss){
    big = r.passed ? "🏆" : "👹";
    title = r.passed ? "CHEFÃO DERRUBADO!" : "O chefão venceu essa…";
    msg = r.passed ? `Tu tá pronto pra Black Friday, ${esc(firstName())}! E agora, o prêmio surpresa… 🎁` : `Precisa de ${BOSS_MIN} acertos. As perguntas mudam a cada tentativa. Revisa as missões e volta pra revanche!`;
  } else {
    big = perfect ? "🏆" : (r.passed ? "👊" : "😵‍💫");
    title = perfect ? "GABARITOU!" : (r.passed ? "Missão cumprida!" : "Não foi dessa vez");
    msg = perfect ? "5 de 5, tu é monstro. Insígnia garantida!" : (r.passed ? "Tá na régua! Próxima missão liberada." : `Precisa de ${PASS_MIN} acertos pra liberar a próxima. Dá uma relida no conteúdo e volta com tudo, as perguntas vêm embaralhadas.`);
  }
  const lines = [[`Acertos (${r.right}/${r.total})`, r.xp], ...r.bonus];
  const lastMission = !r.boss && r.passed && r.i===MODULES.length-1;
  app.innerHTML = `
  <section class="result">
    <div class="big" aria-hidden="true">${big}</div>
    <h2>${title}</h2>
    <div class="scoreline">${r.right}/${r.total}</div>
    <p>${msg}</p>
  </section>
  <div class="gains">${lines.map(([k,v])=>`<div><span>${esc(k)}</span><b>+${v} XP</b></div>`).join("")}</div>
  ${!r.boss && r.passed ? `<p class="muted small" style="text-align:center">Insígnia desbloqueada: ${MODULES[r.i].emoji} <b>${esc(MODULES[r.i].badge)}</b></p>`:""}
  <div class="stack" style="margin-top:14px">
    ${r.boss ? (r.passed
        ? `<button class="btn" id="a1">Abrir meu prêmio surpresa 🎁</button>`
        : `<button class="btn" id="a1">Revanche! 👹</button>`)
      : (r.passed
        ? (lastMission ? `<button class="btn" id="a1">Encarar o Chefão 👹</button>` : `<button class="btn" id="a1">Próxima missão ➜</button>`)
        : `<button class="btn" id="a1">Reler o conteúdo 📖</button><button class="btn ghost" id="a3">Tentar as perguntas de novo</button>`)}
    <button class="btn ghost" id="a2">Voltar pra trilha</button>
  </div>`;
  const a1=document.getElementById("a1");
  a1.onclick = ()=>{
    if(r.boss) return r.passed ? go("cert") : go("bossIntro");
    if(!r.passed) return go("read",{i:r.i,c:0});
    if(lastMission) return go("bossIntro");
    go("intro", r.i+1);
  };
  const a3=document.getElementById("a3"); if(a3) a3.onclick=()=>go("quiz",{i:r.i});
  document.getElementById("a2").onclick = ()=>go("map");
  if(r.passed) toast(r.boss?"👹 Chefão derrotado!":"🏅 +1 insígnia!");
},

bossIntro(){
  if(!allPassed()) return go("map");
  renderTop(true);
  app.innerHTML = `
  <div class="hazard" style="margin:18px -16px 0;height:18px"></div>
  <div class="modhead">
    <div style="font-size:64px;line-height:1;margin:8px 0">👹</div>
    <h2>Chefão da Black Friday</h2>
    <p class="muted" style="margin-top:8px">É dia de pico, a esteira tá voando e os B.O. não param. Mostra que tu segura!</p>
  </div>
  <div class="rules"><ul style="margin:0">
    <li>🎲 ${BOSS_N} perguntas sorteadas de todas as missões</li>
    <li>⏱ ${BOSS_SEC} segundos pra cada uma</li>
    <li>✅ Precisa de <b>${BOSS_MIN} acertos</b></li>
    <li>⚡ Responder rápido dá XP extra</li>
  </ul></div>
  <div class="stack">
    <button class="btn" id="go">Tô pronto, manda! 💪</button>
    <button class="btn ghost" id="bk">Ainda não, voltar</button>
  </div>`;
  document.getElementById("go").onclick=()=>go("quiz",{boss:true});
  document.getElementById("bk").onclick=()=>go("map");
},

celebrate(){
  if(!S.cert) return go("map");
  renderTop(false);
  app.innerHTML = `<section class="celebra">
    <div class="trophy" aria-hidden="true">🏆</div>
    <h1>Curso concluído com sucesso!</h1>
    <p>Parabéns, <b id="cf"></b>! Tu mandou muito bem e chegou até o final. 🎉</p>
    <button class="btn" id="vis">Visualizar</button>
  </section>`;
  document.getElementById("cf").textContent = firstName();
  beep(true);
  confetti();
  const b = document.getElementById("vis");
  timers.push(setTimeout(()=>b.classList.add("show"), 3000));
  b.onclick = ()=>go("cert");
},

cert(){
  if(!S.cert) return go("map");
  renderTop(true);
  const c = S.cert;
  const {L} = level(c.xp);
  const done = MODULES.filter((m,i)=>mod(i).passed).length;
  app.innerHTML = `
  <article class="super">
    <div class="hazard"></div>
    <div class="band">
      <div class="seal" aria-hidden="true"><b>SUPER</b><span>PS</span></div>
      <div class="ttl">Certificado SUPER PS</div>
      <div style="color:#fff;opacity:.8;font-size:14px;margin-top:4px">Curso teórico Problem Solver SVC, Modo Black Friday</div>
    </div>
    <div class="body">
      <div class="muted small">Este certificado é de</div>
      <div class="name" id="cn"></div>
      <div class="msg">
        <p><b>Parabéns!</b> Tu começou <b>e terminou</b> o curso teórico do Problem Solver. Muita gente começa, pouca gente vai até o fim. E tu foi.</p>
        <p style="margin:0">Isso mostra interesse, compromisso e vontade de fazer a diferença na operação. A partir de hoje tu é oficialmente um <b>SUPER PS</b>. 🦸</p>
      </div>
      <table>
        <tr><td>Turno</td><td id="ct"></td></tr>
        <tr><td>Início do curso</td><td>${fmtDT(S.started)}</td></tr>
        <tr><td>Conclusão</td><td>${fmtDT(c.date)}</td></tr>
        <tr><td>Missões</td><td>${done}/${MODULES.length}</td></tr>
        <tr><td>Chefão final</td><td>${c.boss}/${BOSS_N}</td></tr>
        <tr><td>Nível</td><td>${L.e} ${esc(L.n)}</td></tr>
      </table>
    </div>
  </article>
  <section class="gift-sec" id="gs"></section>
  <div class="stack" style="margin-top:18px"><button class="btn ghost" id="bk">Voltar pra trilha</button></div>`;
  document.getElementById("cn").textContent = S.name;
  document.getElementById("ct").textContent = S.turno;
  document.getElementById("bk").onclick = ()=>go("map");
  renderGift();
}
};

if(S.name && !S.sid){ S.sid=uid(); track("inicio",{retroativo:true}, S.started||undefined); if(S.cert) track("fim",{xp:S.cert.xp,retroativo:true}, S.cert.date); }
flush();
go("start");
</script>
</body>
</html>
